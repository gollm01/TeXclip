[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "texclip"
version = "0.4.1"
description = "Type LaTeX math, get a vector graphic you can paste into Affinity (or Inkscape, Illustrator, ...)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Maximilian Goll" }]
keywords = ["latex", "affinity", "svg", "equations", "vector", "customtkinter"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "customtkinter>=5.2",     # modern widgets, light/dark theme
  "tkinterdnd2>=0.4",       # drop a preamble file onto the preamble icon
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
texclip = "texclip.cli:main"

[project.gui-scripts]
texclip-gui = "texclip.gui:main"

[project.urls]
Homepage = "https://github.com/gollm01/TeXclip"
Issues = "https://github.com/gollm01/TeXclip/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
texclip = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]           # test the checkout, not an installed copy
markers = ["tex: needs latex + dvisvgm/dvipng on PATH"]
