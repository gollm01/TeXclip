name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e .[dev]
      # pure-Python tests; the compile tests skip themselves when no TeX is installed
      - run: pytest -q
  tex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended texlive-science dvipng dvisvgm
      - run: pip install -e .[dev]
      - name: Compile tests against a real TeX Live
        run: |
          set -o pipefail
          pytest -q -m tex -rf --tb=short 2>&1 | tee pytest.log
      - name: Surface the failure as an annotation
        if: failure()
        run: |
          python - <<'PY'
          import pathlib, urllib.parse
          log = pathlib.Path("pytest.log").read_text(errors="replace")[-3500:]
          print("::error title=pytest output::" + log.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
